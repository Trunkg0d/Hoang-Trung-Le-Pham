<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/png" href="{{ '/assets/site-logo.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/template.css' | relative_url }}">
    {% feed_meta %}
    {% seo %}
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true
        },
        svg: { fontCache: 'global' }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  </head>
  <body class="page-{{ page.layout | default: 'academic' }}">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="site-container nav-shell">
        <a class="site-name" href="{{ '/' | relative_url }}" aria-label="Hoang-Trung Le-Pham — Home">Hoang-Trung Le-Pham</a>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
          <span class="sr-only">Toggle navigation</span>
          <span></span><span></span><span></span>
        </button>

        <nav id="site-navigation" class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/papers/' | relative_url }}" {% if page.url contains '/papers/' %}aria-current="page"{% endif %}>Publications</a>
          <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects/' %}aria-current="page"{% endif %}>Projects</a>
          <a href="{{ '/writing/' | relative_url }}" {% if page.url contains '/writing/' or page.layout == 'post' %}aria-current="page"{% endif %}>Writing</a>
          <a href="{{ '/Resume/' | relative_url }}" {% if page.url contains '/Resume/' %}aria-current="page"{% endif %}>CV</a>
        </nav>
      </div>
    </header>

    <main id="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-container footer-shell">
        <p>© {{ 'now' | date: '%Y' }} Hoang-Trung Le-Pham</p>
        <div class="footer-links">
          <a href="mailto:trunglph@uit.edu.vn">Email</a>
          <a href="https://github.com/Trunkg0d" rel="me">GitHub</a>
          <a href="https://orcid.org/0009-0004-2490-7923" rel="me">ORCID</a>
        </div>
      </div>
    </footer>

    <script>
      const toggle = document.querySelector('.nav-toggle');
      const navigation = document.querySelector('.site-nav');
      if (toggle && navigation) {
        toggle.addEventListener('click', () => {
          const open = toggle.getAttribute('aria-expanded') === 'true';
          toggle.setAttribute('aria-expanded', String(!open));
          navigation.classList.toggle('is-open', !open);
        });
      }
    </script>
  </body>
</html>
